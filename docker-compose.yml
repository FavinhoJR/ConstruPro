services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: construpro_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - construpro_storage:/var/www/html/storage/app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - construpro

  nginx:
    image: nginx:1.27-alpine
    container_name: construpro_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - construpro_storage:/var/www/html/storage/app
    depends_on:
      - app
    networks:
      - construpro

  postgres:
    image: postgres:16-alpine
    container_name: construpro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: construpro
      POSTGRES_USER: construpro
      POSTGRES_PASSWORD: construpro_secret
    ports:
      - "5432:5432"
    volumes:
      - construpro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U construpro -d construpro"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - construpro

  redis:
    image: redis:7-alpine
    container_name: construpro_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - construpro

volumes:
  construpro_pgdata:
  construpro_storage:

networks:
  construpro:
    driver: bridge
